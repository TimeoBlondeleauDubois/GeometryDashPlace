services:
  db:
    image: postgres:17
    container_name: geometrydashplace-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-geometrydashplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geometrydashplace_dev}
      POSTGRES_DB: ${DB_NAME:-geometry_dash_place}
    ports:
      - "127.0.0.1:${DB_PORT:-21556}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Sql/01-Init.sql:/docker-entrypoint-initdb.d/01-Init.sql:ro
      - ./Sql/02-ObjectTypes.sql:/docker-entrypoint-initdb.d/02-ObjectTypes.sql:ro
      - ./Sql/03-PlacementTransforms.sql:/docker-entrypoint-initdb.d/03-PlacementTransforms.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
